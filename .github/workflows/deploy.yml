name: Deploy to Cloudflare Pages

# Push-to-deploy: every push to main builds the site and deploys it to the
# `patchoutech-architecture` Cloudflare Pages project.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN  — a scoped token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
#
# Until CLOUDFLARE_API_TOKEN is set, the build still runs (as CI) and the deploy
# step is skipped — no red failures while the token is pending.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: npm ci

      - run: npm run build

      # Read the secret into an env var (safe pattern) and check it's present.
      - name: Check for deploy token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy (build validated only)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=patchoutech-architecture --branch=main
