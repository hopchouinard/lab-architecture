name: Deploy to Cloudflare Pages

# Push-to-deploy: every push to main builds the site and deploys it to the
# `patchoutech-architecture` Cloudflare Pages project.
#
# Requires two repo secrets, both set since 2026-06-28:
#   CLOUDFLARE_API_TOKEN  — a scoped token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
#
# If either is ever absent the build still runs (as CI) and only the deploy step
# is skipped, so a missing secret reads as a skipped deploy rather than a red
# build. The token-presence check below is what makes that true.

on:
  push:
    branches: [main]
  # Pull requests build and test but never deploy, so the claim guards run
  # BEFORE a correction is merged rather than after it has already shipped.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: npm ci

      - run: npm run build

      # The suite asserts over dist/, so it runs after the build and before the
      # deploy: a page that revives a retired claim fails here rather than
      # shipping. See tests/claims.test.mjs for why each guard exists.
      - run: npm test

      # Read the secret into an env var (safe pattern) and check it's present.
      - name: Check for deploy token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy (build validated only)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # Never on pull_request: a PR must not be able to publish to production.
        if: steps.token.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=patchoutech-architecture --branch=main
